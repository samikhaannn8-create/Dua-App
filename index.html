<!DOCTYPE html>
<html>
<head>
    <title>Dua App</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 80px;
        }

        #duaBox {
            font-size: 22px;
            margin: 20px;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            display: inline-block;
            width: 60%;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Dua App 📿</h1>

    <div id="duaBox">Click the button to see a Dua</div>

    <br>
    <button onclick="showDua()">Show Dua</button>

    <script>
        // List of duas
        let duas = [
            "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي",
            "رَبِّ زِدْنِي عِلْمًا",
            "اللَّهُمَّ اهْدِنِي الصِّرَاطَ الْمُسْتَقِيمَ",
            "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً",
            "اللَّهُمَّ ارْزُقْنِي رِزْقًا حَلَالًا طَيِّبًا"
        ];

        function showDua() {
            // Generate random index
            let index = Math.floor(Math.random() * duas.length);

            // Display dua
            document.getElementById("duaBox").innerText = duas[index];
        }
    </script>

</body>
</html>
